<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Материал — Арома Дом</title>
    <link rel="icon" href="images/icon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1 id="formTitle">Материал</h1>
        <a href="index.html" class="button secondary">Назад</a>
    </header>

    <main>
        <form id="materialForm" class="form" novalidate>
            <label for="materialTypeId">Тип материала</label>
            <select id="materialTypeId" required></select>

            <label for="materialName">Наименование</label>
            <input type="text" id="materialName" maxlength="200" placeholder="Например: Соевый воск">

            <label for="price">Цена за единицу, р</label>
            <input type="number" id="price" min="0" step="0.01" placeholder="0,00">

            <label for="unitName">Единица измерения</label>
            <input type="text" id="unitName" maxlength="30" placeholder="кг, шт, л">

            <label for="packageQuantity">Количество в упаковке</label>
            <input type="number" id="packageQuantity" min="0" step="any" placeholder="Больше 0">

            <label for="stockQuantity">Количество на складе</label>
            <input type="number" id="stockQuantity" min="0" step="any" placeholder="0 или больше">

            <label for="minQuantity">Минимальное количество</label>
            <input type="number" id="minQuantity" min="0" step="any" placeholder="0 или больше">

            <div class="form-actions">
                <button type="submit" class="button">Сохранить</button>
                <a href="index.html" class="button secondary">Отмена</a>
            </div>
        </form>
    </main>

    <!-- Окно сообщений: заголовок и пиктограмма зависят от типа -->
    <div id="modal" class="modal" hidden>
        <div class="modal-box">
            <div class="modal-title"><span id="modalIcon"></span><span id="modalTitle"></span></div>
            <p id="modalText"></p>
            <button type="button" class="button" id="modalOk">OK</button>
        </div>
    </div>

    <script src="js/material-form.js"></script>
</body>
</html>
